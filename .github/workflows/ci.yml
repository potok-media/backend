name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore potok-gateway.slnx
      - run: dotnet build potok-gateway.slnx -c Release --no-restore
      - run: dotnet test potok-gateway.slnx -c Release --no-build
